# Rendered by entrypoint.sh at container start, with an explicit variable list: ${API_URL} and ${WEB_BUILD} are
# substituted, every nginx $variable survives.

# Cache policy by path: the hashed bundle is immutable; the runtime config and the HTML shell are never cached, so a new
# deploy or a new API_URL reaches the next page load.
map $request_uri $cache_control {
    default                 "no-store";
    ~^/assets/js/env\.js    "no-store";
    ~^/assets/              "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    # Which image answered, so a deploy can wait for its own build rather than for anything at all.
    add_header X-Web-Build "${WEB_BUILD}" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' scripts for the config entrypoint.sh inlines into index.html; the api is the one other origin the
    # page may call.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${API_URL}" always;

    # A missing asset is a 404, never the SPA shell: a stale chunk must fail loudly rather than parse HTML as JavaScript.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
