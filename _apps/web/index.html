<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>App</title>

        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
