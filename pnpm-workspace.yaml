packages:
  - "_apps/*"
  - "_libs/*"
  - "_tools/*"

# `pnpm deploy` (docker:release's pruned api tree) requires injected workspace packages. pnpm still symlinks an injected
# package whose dependencies resolve the same way (dedupeInjectedDeps), so source edits stay live in the workspace.
injectWorkspacePackages: true

# Every `build` is also a linking pass: afterwards pnpm re-materializes the injected copies that hang off the package.
syncInjectedDepsAfterScripts:
  - build

# Off because pnpm keys its pre-run check to the workspace PATH: a git worktree whose node_modules mirror the main
# checkout's is declared out of sync and fully reinstalled before every `pnpm run`. After editing a package.json, run
# `pnpm install` yourself.
verifyDepsBeforeRun: false

nodeVersion: 24.22.1

# Exact pins everywhere, as the catalog: a range in a manifest is a second resolution that nobody chose. Lives here, not
# in .npmrc, which pnpm 12 reads for auth and registry settings only.
savePrefix: ""

# An advisory accepted rather than fixed goes in `ignore` by its GHSA; `ignorePrune` drops entries whose GHSA no longer
# appears in the report, so the list cannot outlive the tree it describes.
audit:
  level: moderate
  ignorePrune: true

# Pnpm's default, stated so `minimumReleaseAgeStrict` is explicit rather than flipped by naming the age. Lenient because
# every catalog entry is an exact pin: strict mode would fail each bump's install until it aged.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: false
minimumReleaseAgeExcludePrune: true

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  bun: true
  esbuild: true
  prisma: true
  vue-demi: true

# ONE CATALOG, enforced rather than reviewed: `pnpm add` refuses a version the catalog does not carry, so a second pin for
# a package cannot enter by hand. A manifest writes `catalog:`, never its own version.
catalogMode: strict

# Drops entries no manifest references any more, so a pin with no effect cannot linger as if it were policy.
catalogPrune: true

catalog:
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  "@commitlint/types": 21.2.3
  "@orpc/client": 1.16.1
  "@orpc/contract": 1.16.1
  "@orpc/openapi": 1.16.1
  "@orpc/openapi-client": 1.16.1
  "@orpc/server": 1.16.1
  "@prisma/adapter-pg": 7.10.1
  "@prisma/client": 7.10.1
  "@puristic/env": 1.6.1
  "@tanstack/vue-query": 5.104.5
  "@types/bun": 1.4.4
  "@types/node": 24.19.2
  "@vitejs/plugin-vue": 6.0.10
  bun: 1.4.4
  esbuild: 0.28.2
  hono: 4.13.13
  oxlint: 1.89.0
  pino: 10.3.1
  pino-pretty: 13.2.0
  prettier: 3.9.9
  prisma: 7.10.1
  turbo: 2.11.7
  # The native compiler. Vue's checker still needs the JavaScript compiler API: see catalogs.typescript6.
  typescript: 7.0.2
  vite: 8.3.5
  vue: 3.5.44
  vue-router: 5.4.0
  vue-tsc: 3.3.13
  zod: 4.6.7

# Checkers that require the JavaScript compiler API and cannot drive TypeScript 7's native launcher yet (vue-tsc).
catalogs:
  typescript6:
    typescript: 6.0.3
