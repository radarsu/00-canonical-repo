# Local infrastructure only; the apps run on the host (`pnpm dev`). No `name:`: the project is named after the checkout's
# directory, so two projects made from this template keep their containers and volumes apart.
services:
    postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        restart: unless-stopped
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        # POSTGRES_PORT in the root .env moves the host port; DATABASE_URL beside it has to follow.
        ports:
            - "${POSTGRES_PORT:-5439}:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
